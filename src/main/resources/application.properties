# =============================================
# APPLICATION
# =============================================
spring.application.name=healthapp
server.port=${PORT:8080}
server.address=0.0.0.0


spring.datasource.url=jdbc:postgresql://localhost:5432/medicalproj
spring.datasource.username=postgres
spring.datasource.password=0983
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# THYMELEAF

spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# JWT

app.jwt.secret=HealthAppSuperSecretKeyMustBe256BitsMinimumForHS256SigningAlgo2024!
app.jwt.expiration=86400000


openai.api.key=${OPENAI_API_KEY:}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.secret.key=${STRIPE_SECRET_KEY}
zego.app.id=${ZEGO_APP_ID}
zego.server.secret=${ZEGO_SERVER_SECRET}


spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=500

spring.autoconfigure.exclude=
  org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,
  org.springframework.ai.autoconfigure.chat.client.ChatClientAutoConfiguration


# FILE UPLOAD

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# LOGGING

logging.level.com.example.healthapp=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
