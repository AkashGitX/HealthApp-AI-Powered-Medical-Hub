<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register — HealthApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="bg-light">

<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow border-0 w-100" style="max-width:480px;">
        <div class="card-body p-5">

            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill text-primary" style="font-size:3rem;"></i>
                <h2 class="fw-bold mt-2">Create Account</h2>
                <p class="text-muted">Join HealthApp — free &amp; secure</p>
            </div>

            <div class="alert alert-danger d-none" id="regError"></div>
            <div class="alert alert-success d-none" id="regSuccess"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="fullName" class="form-control" placeholder="John Doe" required/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-phone"></i></span>
                        <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210"/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required/>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Register As</label>
                    <select id="role" class="form-select" required>
                        <option value="">Select role...</option>
                        <option value="USER">Patient / User</option>
                        <option value="DOCTOR">Doctor</option>
                        <option value="SERVICE_PROVIDER">Service Provider (Medical Shop)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="regBtn">
                    Create Account
                </button>
            </form>

            <hr class="my-4"/>
            <p class="text-center text-muted mb-0">
                Already have an account?
                <a th:href="@{/auth/login}" class="text-primary fw-semibold">Sign in</a>
            </p>
            <p class="text-center mt-2">
                <a th:href="@{/}" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('regBtn');
        const errorDiv = document.getElementById('regError');
        const successDiv = document.getElementById('regSuccess');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';
        errorDiv.classList.add('d-none');
        successDiv.classList.add('d-none');

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value,
                    role: document.getElementById('role').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('user_name', data.fullName);
                successDiv.textContent = 'Account created! Redirecting...';
                successDiv.classList.remove('d-none');
                setTimeout(() => window.location.href = data.redirectUrl, 1000);
            } else {
                errorDiv.textContent = data.message || 'Registration failed';
                errorDiv.classList.remove('d-none');
            }
        } catch (err) {
            errorDiv.textContent = 'Connection error. Please try again.';
            errorDiv.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Create Account';
        }
    });
</script>
</body>
</html>
