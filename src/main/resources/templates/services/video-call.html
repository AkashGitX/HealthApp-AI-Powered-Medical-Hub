<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Video Consultation — HealthApp</title>
    <!--
        ZegoCloud credentials injected server-side via Thymeleaf.
        These meta tags are read by JS below — serverSecret never logged.
    -->
    <meta name="zego-app-id"       th:content="${zegoAppId}"/>
    <meta name="zego-server-secret" th:content="${zegoServerSecret}"/>
    <meta name="zego-room-id"      th:content="${roomId}"/>
    <meta name="zego-configured"   th:content="${zegoConfigured}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body { background:#0f0f1a; color:#e0e0ff; }
        #root {
            width: 100%;
            height: calc(100vh - 60px);
        }
        .zego-placeholder {
            background: linear-gradient(135deg,#16213e,#0f3460);
            border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            min-height: 400px;
            color:#7090c0;
        }
        .top-bar { background:#1a1a2e; height:60px; }
    </style>
</head>
<body>

<!-- Top bar -->
<div class="top-bar d-flex align-items-center px-4 gap-3">
    <a href="/" class="text-decoration-none">
        <span class="fw-bold text-white fs-5"><i class="bi bi-heart-pulse-fill text-danger me-2"></i>HealthApp</span>
    </a>
    <span class="badge bg-danger px-3 py-1"><i class="bi bi-record-circle me-1"></i>LIVE</span>
    <span class="ms-auto text-white-50 small">
        Room: <strong id="roomDisplay" th:text="${roomId}">room-id</strong>
        &nbsp;|&nbsp;
        <span th:text="${role == 'doctor' ? 'Doctor' : 'Patient'}">Role</span>
    </span>
</div>

<!-- ZegoCloud mounts here when configured -->
<div id="root"></div>

<!-- Shown only when ZegoCloud is NOT configured -->
<div id="notConfigured" class="container py-5" style="display:none;">
    <div class="zego-placeholder py-5">
        <div class="text-center">
            <i class="bi bi-camera-video-off fs-1 d-block mb-3"></i>
            <h5 class="text-white mb-2">Video Calling Not Configured</h5>
            <p class="mb-3" style="color:#8090b0;">
                ZegoCloud credentials are not set. To enable live video:
            </p>
            <ol class="text-start d-inline-block" style="color:#8090b0;">
                <li>Sign up at <a href="https://zegocloud.com" target="_blank" style="color:#60a0ff;">zegocloud.com</a></li>
                <li>Create a project and copy your <strong>App ID</strong> and <strong>Server Secret</strong></li>
                <li>Add them as <code>ZEGO_APP_ID</code> and <code>ZEGO_SERVER_SECRET</code> secrets</li>
            </ol>
            <div class="mt-4">
                <a href="/" class="btn btn-outline-light me-2">
                    <i class="bi bi-house me-1"></i>Go Home
                </a>
            </div>
        </div>
    </div>
</div>

<!-- ZegoCloud SDK -->
<script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
<script>
(function () {
    const configured = document.querySelector('meta[name="zego-configured"]').content === 'true';

    if (!configured) {
        document.getElementById('root').style.display = 'none';
        document.getElementById('notConfigured').style.display = 'block';
        return;
    }

    const appIDStr     = document.querySelector('meta[name="zego-app-id"]').content;
    const serverSecret = document.querySelector('meta[name="zego-server-secret"]').content;
    const roomID       = document.querySelector('meta[name="zego-room-id"]').content;
    const appID        = parseInt(appIDStr, 10);

    const urlParams = new URLSearchParams(window.location.search);
    const role      = urlParams.get('role') || 'user';
    const userID    = Math.floor(Math.random() * 10000) + '';
    const userName  = localStorage.getItem('user_name') || ('User' + userID);

    console.log("Room ID:", roomID);
    console.log("Joining as role:", role);
    console.log("User name:", userName);

    if (!roomID) {
        document.getElementById('root').style.display = 'none';
        document.getElementById('notConfigured').style.display = 'block';
        document.getElementById('notConfigured').innerHTML = `
            <div class="container py-5">
                <div class="zego-placeholder py-5">
                    <div class="text-center">
                        <i class="bi bi-exclamation-triangle fs-1 d-block mb-3 text-warning"></i>
                        <h5 class="text-white mb-2">No Room ID Found</h5>
                        <p style="color:#8090b0;">This consultation session could not be loaded. Please go back and try again.</p>
                        <a href="/user/dashboard" class="btn btn-outline-light mt-3"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
                    </div>
                </div>
            </div>`;
        return;
    }

    // ZegoCloud owns the full camera/mic lifecycle.
    // Do NOT run getUserMedia before joinRoom — any probe that opens the device
    // and then releases it causes a race condition where the OS hasn't fully
    // freed the hardware before ZegoCloud grabs it, resulting in the stream
    // joining without video. ZegoCloud's SDK requests permissions internally
    // and publishes the stream when turnOnCameraWhenJoining = true.
    console.log("Starting ZegoCloud — room:", roomID, "role:", role, "user:", userName);
    try {
        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
            appID, serverSecret, roomID, userID, userName);

        console.log("Token generated — joining room");
        const zp = ZegoUIKitPrebuilt.create(kitToken);
        zp.joinRoom({
            container:                    document.querySelector('#root'),
            sharedLinks: [{
                name: 'Consultation link',
                url:  window.location.protocol + '//' + window.location.host +
                      window.location.pathname + '?roomID=' + roomID + '&role=' + role
            }],
            scenario: {
                mode: ZegoUIKitPrebuilt.VideoConference
            },
            turnOnCameraWhenJoining:      true,
            turnOnMicrophoneWhenJoining:  true,
            showMyCameraToggleButton:     true,
            showMyMicrophoneToggleButton: true,
            showAudioVideoSettingsButton: true,
            showScreenSharingButton:      true,
            showTextChat:                 true,
            showUserList:                 true,
            maxUsers:                     2,
            layout:                       'Auto',
            showLayoutButton:             false
        });
    } catch (err) {
        console.error("ZegoCloud join failed:", err);
        document.getElementById('root').style.display = 'none';
        document.getElementById('notConfigured').style.display = 'block';
        document.getElementById('notConfigured').innerHTML = `
            <div class="container py-5">
                <div class="zego-placeholder py-5">
                    <div class="text-center">
                        <i class="bi bi-camera-video-off fs-1 d-block mb-3 text-danger"></i>
                        <h5 class="text-white mb-2">Video Call Failed to Start</h5>
                        <p style="color:#8090b0;">Could not connect to the video room. Please allow camera and microphone access, then retry.</p>
                        <button onclick="window.location.reload()" class="btn btn-primary mt-3 me-2">
                            <i class="bi bi-arrow-clockwise me-1"></i>Retry
                        </button>
                        <a href="/" class="btn btn-outline-light mt-3"><i class="bi bi-house me-1"></i>Go Home</a>
                    </div>
                </div>
            </div>`;
    }
})();
</script>
</body>
</html>
